# Builds one zip per demo_* folder and attaches them to a GitHub Release.
#
# Runs when a version tag (v1.0, v1.1, ...) is pushed. Publishing a release in the
# GitHub web UI creates the tag and therefore triggers this too. It can also be run
# by hand from the Actions tab to rebuild the zips for an existing tag.
#
# New demo folders are picked up automatically: any top-level folder named demo_*.
name: Release demo zips

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build the zips for, e.g. v1.0'
        required: true

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          ref: ${{ env.TAG }}

      - name: Build one zip per demo folder
        run: |
          set -euo pipefail
          mkdir -p dist stage
          count=0
          for dir in demo_*/; do
            name="${dir%/}"
            rm -rf stage/*
            cp -R "$name" stage/
            cp LICENSE.md "stage/$name/LICENSE.md"
            (cd stage && zip -q -r -X "../dist/$name.zip" "$name" -x '*/.DS_Store' -x '*/._*')
            count=$((count + 1))
          done
          echo "Built $count zips"
          ls -l dist

      - name: Attach zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes
          fi
